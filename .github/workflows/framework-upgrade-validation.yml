name: Framework upgrade validation

on:
  push:
    branches:
      - main
      - upgrade/next16-react19-security
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
