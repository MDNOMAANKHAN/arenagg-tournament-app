name: Framework upgrade validation

on:
  push:
    branches:
      - main
      - upgrade/next16-react19-security
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm regenerates the lockfile after the manifest upgrade.
      # Scripts are disabled here so no dependency code runs with write access.
      - name: Sync package lock
        if: github.ref == 'refs/heads/upgrade/next16-react19-security'
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile update
        if: github.ref == 'refs/heads/upgrade/next16-react19-security'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lockfile for framework upgrade"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${BRANCH}"

      - name: Install from lockfile
        run: npm ci

      - name: Dependency security audit
        run: npm audit --omit=dev

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
