<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071326">
  <title>ARENAGG — You're offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#050b18;color:#eef6ff;font-family:system-ui,sans-serif}
    main{max-width:440px;text-align:center;border:1px solid #1c4261;border-radius:24px;background:#0b1628;padding:32px}
    img{width:76px;height:76px}h1{font-size:26px;margin:18px 0 10px}p{color:#9db1c8;line-height:1.65}button{margin-top:12px;border:0;border-radius:12px;background:linear-gradient(90deg,#06b6d4,#2563eb);color:white;padding:14px 20px;font-weight:800}
  </style>
</head>
<body><main>
  <img src="/arenagg-mark.svg" alt="ARENAGG">
  <h1>You're offline</h1>
  <p>Reconnect to the internet to register for tournaments or check the latest registration status. Your installed ARENAGG app is ready when your connection returns.</p>
  <button onclick="location.reload()">Try again</button>
</main></body></html>
